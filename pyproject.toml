[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-toolkit"
version = "1.1.0"
description = "Lanzador interactivo de herramientas OSINT para terminal"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "anthra123x" }]

[project.scripts]
osint-menu = "osint_toolkit.cli:main"

[tool.setuptools]
packages = ["osint_toolkit"]